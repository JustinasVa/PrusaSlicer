name: Build Windows portable (surface-slicing fork)

# Self-contained build that runs entirely on GitHub-hosted runners —
# no secrets, no private reusable workflows, works on any fork.
# First run compiles all dependencies (~1.5 h); afterwards they come
# from the cache (saved even if a later step fails) and a build takes
# well under an hour.

on:
  push:
    branches: [ surface-slicing ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build/destdir
          key: deps-win64-vs2022-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Tool versions
        shell: cmd
        run: cmake --version

      - name: Build dependencies (Release only)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd deps
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DDEP_DEBUG=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release

      - name: Save dependency cache
        # Save even when the app configure/build below fails, so iterating
        # on application-level errors does not rebuild the deps every time.
        if: always() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/destdir
          key: deps-win64-vs2022-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Inspect deps destdir
        shell: pwsh
        # Publish what the deps actually installed as a notice annotation —
        # annotations are readable via the public API, full logs are not.
        run: |
          $lib = Join-Path $env:GITHUB_WORKSPACE 'deps\build\destdir\usr\local\lib'
          $names = (Get-ChildItem $lib -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
          if (-not $names) { $names = "(lib dir missing at $lib)" }
          if ($names.Length -gt 3200) { $names = $names.Substring(0, 3200) + ' ...' }
          Write-Output "::notice title=deps lib dir::$names"

      - name: Configure PrusaSlicer
        shell: pwsh
        # CMAKE_CONFIGURATION_TYPES=Release: deps are built Release-only
        # (DEP_DEBUG=OFF) and the bundled FindOpenVDB.cmake requires a debug
        # openvdb lib whenever "Debug" is among the configured types on MSVC.
        # On failure the log tail is published as an error annotation.
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          Set-Location build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\deps\build\destdir\usr\local" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content configure.log -Tail 60) -join '%0A') -replace "`r", ''
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            Write-Output "::error title=CMake configure failed (log tail)::$tail"
            exit 1
          }

      - name: Build PrusaSlicer
        shell: pwsh
        run: |
          Set-Location build
          cmake --build . --config Release -- /m *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $errs = (Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+|CMake Error|: error' | Select-Object -First 25 | ForEach-Object Line) -join '%0A'
            if ($errs.Length -gt 3500) { $errs = $errs.Substring(0, 3500) }
            Write-Output "::error title=Compile errors (first 25)::$errs"
            exit 1
          }

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item build/src/Release/* portable/ -Recurse
          Copy-Item resources portable/resources -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-surface-slicing-win64
          path: portable
          retention-days: 30
