name: Build windows

# Note (surface-slicing fork): push trigger disabled — this reusable
# workflow needs Prusa's internal secrets and fails on forks. Use
# build_surface_slicing.yml instead; this one stays manual-only.
on:
  workflow_dispatch:
    inputs:
      create_pdb:
        description: 'Zip pdbs'
        default: false
        type: boolean
      create_installer:
        description: 'Create installer'
        default: false
        type: boolean

jobs:
  build_win:
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/build_windows.yml@legacy
    secrets: inherit
    with:
      actions_branch: legacy
      create_pdb: ${{ inputs.create_pdb || false }}
      create_installer: ${{ inputs.create_installer || false }}
